name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch the Victorian font (Old Standard TT, SIL Open Font Licence)
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          FONTS="$(dirname "$SETTINGS")/app/src/main/assets/fonts"
          mkdir -p "$FONTS"
          for f in OldStandard-Regular OldStandard-Bold OldStandard-Italic; do
            if ! curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/$f.ttf" -o "$FONTS/$f.ttf"; then
              echo "Could not download $f, so the Victorian font will be skipped."
              rm -f "$FONTS"/OldStandard-*.ttf
              break
            fi
          done
          ls -la "$FONTS"
      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: " build.log
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: brassworks-apk
          path: "**/build/outputs/apk/debug/*.apk"
