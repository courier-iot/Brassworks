name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch the Victorian font (Old Standard TT, SIL Open Font Licence)
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          FONTS="$(dirname "$SETTINGS")/app/src/main/assets/fonts"
          mkdir -p "$FONTS"
          echo "Fonts folder: $FONTS"
          good() { [ -s "$1" ] && [ "$(stat -c%s "$1")" -ge 20000 ] && case "$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')" in 00010000|4f54544f|74727565) true ;; *) false ;; esac; }
          missing() { for s in Regular Bold Italic; do good "$FONTS/OldStandard-$s.ttf" || return 0; done; return 1; }
          if ! missing; then echo "All three font files are already in the project, keeping them."; fi
          if missing; then
            # 1. Ask git for just the Old Standard TT folder of Google Fonts, and pick the files by style
            #    (so we do not have to guess their exact names).
            TMP=$(mktemp -d)
            if git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/google/fonts.git "$TMP/gf" \
               && git -C "$TMP/gf" sparse-checkout set ofl/oldstandardtt; then
              echo "Files in google/fonts ofl/oldstandardtt:"
              ls -la "$TMP/gf/ofl/oldstandardtt" || true
              for s in Regular Bold Italic; do
                good "$FONTS/OldStandard-$s.ttf" && continue
                src=$(ls "$TMP/gf/ofl/oldstandardtt"/*.ttf 2>/dev/null | grep -i -- "-$s\.ttf\$" | head -n 1)
                if [ -n "$src" ]; then cp "$src" "$FONTS/OldStandard-$s.ttf"; echo "Copied $(basename "$src") as OldStandard-$s.ttf"; fi
              done
            else
              echo "git clone of google/fonts failed"
            fi
          fi
          if missing; then
            # 2. Plain downloads, trying both name styles and two hosts
            SHA=2796410152d4f9524b68ed46e69c1b60f8e0f7c3
            for s in Regular Bold Italic; do
              good "$FONTS/OldStandard-$s.ttf" && continue
              for name in "OldStandard-$s" "OldStandardTT-$s"; do
                for url in \
                  "https://raw.githubusercontent.com/google/fonts/$SHA/ofl/oldstandardtt/$name.ttf" \
                  "https://cdn.jsdelivr.net/gh/google/fonts@$SHA/ofl/oldstandardtt/$name.ttf" \
                  "https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/$name.ttf"; do
                  echo "Trying $url"
                  if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "$FONTS/OldStandard-$s.ttf" && good "$FONTS/OldStandard-$s.ttf"; then
                    echo "Got OldStandard-$s.ttf ($(stat -c%s "$FONTS/OldStandard-$s.ttf") bytes)"
                    break 2
                  fi
                  rm -f "$FONTS/OldStandard-$s.ttf"
                done
              done
            done
          fi
          if missing; then
            echo "::error::The Victorian font could not be downloaded, so this build has no Victorian font. Put OldStandard-Regular.ttf, OldStandard-Bold.ttf and OldStandard-Italic.ttf into app/src/main/assets/fonts in your repository and this step will use them."
            rm -f "$FONTS"/OldStandard-*.ttf
          else
            echo "Victorian font ready."
          fi
          ls -la "$FONTS"
      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: " build.log
            exit 1
          }
      - name: Check what is inside the APK
        run: |
          APK=$(find . -name "app-debug.apk" | head -n 1)
          echo "APK: $APK"
          echo "--- fonts ---"
          unzip -l "$APK" | grep -i "assets/fonts" || echo "::error::There are no fonts inside this APK"
          echo "--- sounds ---"
          unzip -l "$APK" | grep -ic "assets/sounds/.*wav" | sed 's/^/sound files: /'
      - uses: actions/upload-artifact@v4
        with:
          name: brassworks-apk
          path: "**/build/outputs/apk/debug/*.apk"
