name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch the Victorian font (Old Standard TT, SIL Open Font Licence)
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          FONTS="$(dirname "$SETTINGS")/app/src/main/assets/fonts"
          mkdir -p "$FONTS"
          echo "Fonts folder: $FONTS"
          good() { [ -s "$1" ] && [ "$(stat -c%s "$1")" -ge 20000 ] && case "$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')" in 00010000|4f54544f|74727565) true ;; *) false ;; esac; }
          # pinned to one exact version of the google/fonts repository so the file names cannot change under us
          SHA=2796410152d4f9524b68ed46e69c1b60f8e0f7c3
          for f in OldStandard-Regular OldStandard-Bold OldStandard-Italic; do
            if good "$FONTS/$f.ttf"; then echo "$f.ttf is already in the project, keeping it."; continue; fi
            rm -f "$FONTS/$f.ttf"
            for url in \
              "https://raw.githubusercontent.com/google/fonts/$SHA/ofl/oldstandardtt/$f.ttf" \
              "https://cdn.jsdelivr.net/gh/google/fonts@$SHA/ofl/oldstandardtt/$f.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/$f.ttf"; do
              echo "Trying $url"
              if curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$FONTS/$f.ttf" && good "$FONTS/$f.ttf"; then
                echo "Got $f.ttf ($(stat -c%s "$FONTS/$f.ttf") bytes)"
                break
              fi
              rm -f "$FONTS/$f.ttf"
            done
          done
          ok=1
          for f in OldStandard-Regular OldStandard-Bold OldStandard-Italic; do good "$FONTS/$f.ttf" || ok=0; done
          if [ "$ok" = 1 ]; then
            echo "Victorian font ready."
          else
            echo "::error::The Victorian font could not be downloaded, so this build has no Victorian font. Put OldStandard-Regular.ttf, OldStandard-Bold.ttf and OldStandard-Italic.ttf into app/src/main/assets/fonts in your repository and this step will use them."
            rm -f "$FONTS"/OldStandard-*.ttf
          fi
          ls -la "$FONTS"
      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: " build.log
            exit 1
          }
      - name: Check what is inside the APK
        run: |
          APK=$(find . -name "app-debug.apk" | head -n 1)
          echo "APK: $APK"
          echo "--- fonts ---"
          unzip -l "$APK" | grep -i "assets/fonts" || echo "::error::There are no fonts inside this APK"
          echo "--- sounds ---"
          unzip -l "$APK" | grep -ic "assets/sounds/.*wav" | sed 's/^/sound files: /'
      - uses: actions/upload-artifact@v4
        with:
          name: brassworks-apk
          path: "**/build/outputs/apk/debug/*.apk"
