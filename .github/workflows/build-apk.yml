name: Build APK
on:
  push:
    branches: [main, master]
    tags: ["v*"]          # pushing a tag like v1.0.0 publishes a GitHub Release
  workflow_dispatch:

permissions:
  contents: write         # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch the Victorian font (Old Standard TT, SIL Open Font Licence)
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          FONTS="$(dirname "$SETTINGS")/app/src/main/assets/fonts"
          mkdir -p "$FONTS"
          echo "Fonts folder: $FONTS"
          good() { [ -s "$1" ] && [ "$(stat -c%s "$1")" -ge 20000 ] && case "$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')" in 00010000|4f54544f|74727565) true ;; *) false ;; esac; }
          missing() { for s in Regular Bold Italic; do good "$FONTS/OldStandard-$s.ttf" || return 0; done; return 1; }
          if ! missing; then echo "All three font files are already in the project, keeping them."; fi
          if missing; then
            TMP=$(mktemp -d)
            if git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/google/fonts.git "$TMP/gf" \
               && git -C "$TMP/gf" sparse-checkout set ofl/oldstandardtt; then
              ls -la "$TMP/gf/ofl/oldstandardtt" || true
              for s in Regular Bold Italic; do
                good "$FONTS/OldStandard-$s.ttf" && continue
                src=$(ls "$TMP/gf/ofl/oldstandardtt"/*.ttf 2>/dev/null | grep -i -- "-$s\.ttf\$" | head -n 1)
                if [ -n "$src" ]; then cp "$src" "$FONTS/OldStandard-$s.ttf"; echo "Copied $(basename "$src") as OldStandard-$s.ttf"; fi
              done
            else
              echo "git clone of google/fonts failed"
            fi
          fi
          if missing; then
            SHA=2796410152d4f9524b68ed46e69c1b60f8e0f7c3
            for s in Regular Bold Italic; do
              good "$FONTS/OldStandard-$s.ttf" && continue
              for name in "OldStandard-$s" "OldStandardTT-$s"; do
                for url in \
                  "https://raw.githubusercontent.com/google/fonts/$SHA/ofl/oldstandardtt/$name.ttf" \
                  "https://cdn.jsdelivr.net/gh/google/fonts@$SHA/ofl/oldstandardtt/$name.ttf" \
                  "https://raw.githubusercontent.com/google/fonts/main/ofl/oldstandardtt/$name.ttf"; do
                  echo "Trying $url"
                  if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "$FONTS/OldStandard-$s.ttf" && good "$FONTS/OldStandard-$s.ttf"; then
                    echo "Got OldStandard-$s.ttf"
                    break 2
                  fi
                  rm -f "$FONTS/OldStandard-$s.ttf"
                done
              done
            done
          fi
          if missing; then
            echo "::error::The Victorian font could not be downloaded. Put OldStandard-Regular.ttf, OldStandard-Bold.ttf and OldStandard-Italic.ttf into app/src/main/assets/fonts."
            rm -f "$FONTS"/OldStandard-*.ttf
            # A public release must not ship without the font
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then exit 1; fi
          else
            echo "Victorian font ready."
          fi
          ls -la "$FONTS"

      - name: Decode the release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, so this release cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BRASSWORKS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          BRASSWORKS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BRASSWORKS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BRASSWORKS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "Running $TASK"
          gradle $TASK --no-daemon --console=plain > build.log 2>&1 || {
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: " build.log
            tail -n 40 build.log
            exit 1
          }

      - name: Check what is inside the APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -i "assets/fonts" || echo "::error::There are no fonts inside this APK"
          unzip -l "$APK" | grep -ic "assets/sounds/.*wav" | sed 's/^/sound files: /'

      # Ordinary pushes: a test build in the Actions tab, as before
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: brassworks-apk
          path: "**/build/outputs/apk/debug/*.apk"

      # Tags: rename, checksum and publish to the Releases page
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=$(find . -path "*/build/outputs/apk/release/*" -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$APK" "dist/Brassworks-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true          # review the notes, then press Publish
