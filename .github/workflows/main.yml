name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle.kts found. Files in the repo:"
            find . -not -path "./.git/*" | head -100
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          pwd
          ls
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: brassworks-apk
          path: "**/build/outputs/apk/debug/*.apk"
